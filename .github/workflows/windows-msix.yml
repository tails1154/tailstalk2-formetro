name: Windows MSIX

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Create temporary package signing certificate
        shell: pwsh
        run: |
          $password = [guid]::NewGuid().ToString("N")
          $securePassword = ConvertTo-SecureString -String $password -AsPlainText -Force
          $certificate = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=TAILSTALK2-METRO-DEV" `
            -KeyUsage DigitalSignature `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3") `
            -CertStoreLocation Cert:\CurrentUser\My
          $pfxPath = Join-Path $env:RUNNER_TEMP "tailstalk2-metro-ci.pfx"
          Export-PfxCertificate -Cert $certificate -FilePath $pfxPath -Password $securePassword | Out-Null
          "MSIX_CERT_PATH=$pfxPath" >> $env:GITHUB_ENV
          "MSIX_CERT_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: Build signed MSIX
        run: npm run make

      - name: Collect package and public certificate
        shell: pwsh
        run: |
          $package = Get-ChildItem -Path out/make -Recurse -Filter *.msix | Select-Object -First 1
          if (-not $package) { throw "The MSIX maker produced no .msix package." }
          New-Item -ItemType Directory -Path artifacts | Out-Null
          Copy-Item $package.FullName "artifacts/TailsTalk2-Metro.msix"
          $certificate = Get-ChildItem Cert:\CurrentUser\My |
            Where-Object { $_.Subject -eq "CN=TAILSTALK2-METRO-DEV" } |
            Sort-Object NotAfter -Descending |
            Select-Object -First 1
          if (-not $certificate) { throw "The temporary signing certificate was not found." }
          Export-Certificate -Cert $certificate -FilePath "artifacts/TailsTalk2-Metro.cer" | Out-Null

      - uses: actions/upload-artifact@v4
        with:
          name: TailsTalk2-Metro-Windows-x64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
